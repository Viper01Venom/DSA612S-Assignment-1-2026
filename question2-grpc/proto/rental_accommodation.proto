syntax = "proto3";

package accommodation;

enum Role {
    HOST = 0;
    GUEST = 1;
}

message User {
    string user_id = 1;
    string name = 2;
    Role role = 3;
    string email = 4;
    string phone = 5;
}

message Property {
    string property_id = 1;
    string host_id = 2;
    string name = 3;
    string location = 4;
    string property_type = 5;
    double price_per_night = 6;
    string status = 7;
    bool available = 8;
}

message Booking {
    string booking_id = 1;
    string property_id = 2;
    string guest_id = 3;
    string check_in = 4;
    string check_out = 5;
    double total_cost = 6;
    string status = 7;
}

message PropertyRequest {
    string host_id = 1;
    string name = 2;
    string location = 3;
    string property_type = 4;
    double price_per_night = 5;
}

message PropertyResponse {
    string property_id = 1;
}

message UserStreamResponse {
    string message = 1;
}

message UpdatePropertyRequest {
    Property property = 1;
}

message UpdatePropertyResponse {
    bool success = 1;
}

message RemovePropertyRequest {
    string property_id = 1;
}

message RemovePropertyResponse {
    repeated Property remaining_properties = 1;
}

message ListPropertiesRequest {
    string location = 1;
    double max_price = 2;
}

message SearchPropertyRequest {
    string property_id = 1;
}

message BookPropertyRequest {
    string property_id = 1;
    string guest_id = 2;
    string check_in = 3;
    string check_out = 4;
}

message BookPropertyResponse {
    string message = 1;
    string cart_id = 2;
}

message ConfirmBookingRequest {
    string cart_id = 1;
    string guest_id = 2;
}

message ConfirmBookingResponse {
    Booking booking = 1;
    string message = 2;
}

service AccommodationService {
    // 1. add_property (Simple RPC)
    rpc add_property(PropertyRequest) returns (PropertyResponse);
    
    // 2. create_users (Client-side Streaming)
    rpc create_users(stream User) returns (UserStreamResponse);
    
    // 3. update_property (Simple RPC)
    rpc update_property(UpdatePropertyRequest) returns (UpdatePropertyResponse);
    
    // 4. remove_property (Simple RPC)
    rpc remove_property(RemovePropertyRequest) returns (RemovePropertyResponse);
    
    // 5. list_available_properties (Server-side Streaming)
    rpc list_available_properties(ListPropertiesRequest) returns (stream Property);
    
    // 6. search_property (Simple RPC)
    rpc search_property(SearchPropertyRequest) returns (Property);
    
    // 7. book_property (Simple RPC)
    rpc book_property(BookPropertyRequest) returns (BookPropertyResponse);
    
    // 8. confirm_booking (Simple RPC)
    rpc confirm_booking(ConfirmBookingRequest) returns (ConfirmBookingResponse);
}// Rental accommodation gRPC definition
